[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="art/cover2.png,art/logo2_b.png,art/logo2_a.png,tools/*,assets/concepts/*,assets/characters/state.json,assets/state_assets.json,art/cover_art.png,art/logo_a.png,art/logo_b.png,art/cover_ps2_style.png"
export_path="build/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/head_include="<link rel=\"icon\" type=\"image/png\" href=\"index.icon.png\"><meta name=\"theme-color\" content=\"#0b0806\">"
html/focus_canvas_on_start=true
